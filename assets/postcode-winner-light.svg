<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Vertex — two first-place team wins</title>
  <desc id="desc">ML engineer and builder. Team Mega Команда won first place in two tracks at PostCode Challenge 2026: support request categorization and transport load estimation from photos.</desc>
  <rect width="1000" height="360" fill="#ffffff"/>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" fill="#1f2328">
    <text x="36" y="40" font-size="20" font-weight="700" letter-spacing="4">VERTEX</text>
    <text x="964" y="40" text-anchor="end" font-size="16" fill="#656d76" letter-spacing="1">ML ENGINEER / BUILDER</text>
  </g>
  <path d="M36 63H964M36 263H964" stroke="#d0d7de" stroke-width="1"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2328" font-weight="900">
    <text x="30" y="229" font-size="176" letter-spacing="-12">2×</text>
    <text x="316" y="150" font-size="78" letter-spacing="-3">FIRST</text>
    <text x="316" y="231" font-size="78" letter-spacing="-3">PLACE.</text>
  </g>
  <path d="M826 100V231" stroke="#d0d7de" stroke-width="1"/>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" fill="#656d76">
    <text x="964" y="142" text-anchor="end" font-size="44" fill="#1f2328">20</text>
    <text x="964" y="195" text-anchor="end" font-size="44" fill="#1f2328">26</text>
    <text x="36" y="309" font-size="29" fill="#1f2328">POSTCODE CHALLENGE</text>
    <text x="964" y="339" text-anchor="end" font-size="17" letter-spacing="2">TWO TRACKS. ONE TEAM.</text>
  </g>
</svg>
